<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Адмін-панель — Реєстр стажування</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #fafafa;
            color: #111111;
        }
        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }
    </style>
</head>
<body class="text-neutral-900 antialiased min-h-screen selection:bg-neutral-900 selection:text-white" x-data="adminDashboard()">

    <main class="max-w-6xl mx-auto px-6 py-12 md:py-16">

        <!-- Header -->
        <header class="border-b border-neutral-200 pb-6 mb-8 flex flex-col sm:flex-row sm:items-center justify-between gap-4 bg-white p-6 shadow-sm border">
            <div>
                <div class="text-xs font-mono tracking-widest text-neutral-400 uppercase mb-1">Панель керування</div>
                <h1 class="text-2xl font-bold tracking-tight">Адміністрування рейтингу</h1>
            </div>
            <a href="index.html" target="_blank" class="px-4 py-2 text-xs font-mono uppercase tracking-wider bg-neutral-100 hover:bg-neutral-900 hover:text-white border border-neutral-200 transition text-center">
                Відкрити публічний сайт ↗
            </a>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <!-- Форма добавления кандидата -->
            <div class="bg-white p-6 border border-neutral-200 shadow-sm h-fit">
                <h2 class="text-base font-bold mb-4 pb-2 border-b border-neutral-100">Додати кандидата</h2>
                
                <form @submit.prevent="addCandidate" class="space-y-4">
                    <div>
                        <label class="block text-xs font-mono uppercase text-neutral-500 mb-1">Повне ім'я</label>
                        <input type="text" x-model="newCandidate.name" required placeholder="Наприклад: Софія Коваленко"
                            class="w-full bg-white border border-neutral-200 px-3 py-2 text-sm focus:outline-none focus:border-neutral-900 transition font-sans">
                    </div>

                    <div>
                        <label class="block text-xs font-mono uppercase text-neutral-500 mb-1">Редакція</label>
                        <select x-model="newCandidate.media" class="w-full bg-white border border-neutral-200 px-3 py-2 text-sm focus:outline-none focus:border-neutral-900 transition font-sans">
                            <option value="Українська правда">Українська правда</option>
                            <option value="Forbes Ukraine">Forbes Ukraine</option>
                            <option value="Радіо Свобода">Радіо Свобода</option>
                        </select>
                    </div>

                    <div class="grid grid-cols-3 gap-2">
                        <div>
                            <label class="block text-[10px] font-mono uppercase text-neutral-400 mb-1">Етап 1 (/20)</label>
                            <input type="number" step="0.1" min="0" max="20" x-model.number="newCandidate.stage1" 
                                class="w-full bg-white border border-neutral-200 px-2 py-2 text-sm font-mono text-center focus:outline-none focus:border-neutral-900">
                        </div>
                        <div>
                            <label class="block text-[10px] font-mono uppercase text-neutral-400 mb-1">Етап 2 (/40)</label>
                            <input type="number" step="0.1" min="0" max="40" x-model.number="newCandidate.stage2" 
                                class="w-full bg-white border border-neutral-200 px-2 py-2 text-sm font-mono text-center focus:outline-none focus:border-neutral-900">
                        </div>
                        <div>
                            <label class="block text-[10px] font-mono uppercase text-neutral-400 mb-1">Етап 3 (/40)</label>
                            <input type="number" step="0.1" min="0" max="40" x-model.number="newCandidate.stage3" 
                                class="w-full bg-white border border-neutral-200 px-2 py-2 text-sm font-mono text-center focus:outline-none focus:border-neutral-900">
                        </div>
                    </div>

                    <button type="submit" class="w-full py-2.5 bg-neutral-900 text-white text-xs font-mono uppercase tracking-wider hover:bg-neutral-800 transition mt-2">
                        Додати в реєстр
                    </button>
                </form>
            </div>

            <!-- Таблица управления баллами -->
            <div class="lg:col-span-2 bg-white border border-neutral-200 shadow-sm overflow-hidden">
                <div class="p-6 border-b border-neutral-100 flex justify-between items-center">
                    <h2 class="text-base font-bold">Список кандидатів (Редагування)</h2>
                    <span class="text-xs font-mono text-neutral-400" x-text="`Всього: ${candidates.length}`"></span>
                </div>

                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="border-b border-neutral-200 text-xs font-mono text-neutral-400 uppercase tracking-wider bg-neutral-50/50">
                                <th class="py-3 px-4">Кандидат</th>
                                <th class="py-3 px-3 text-center">Е1 (/20)</th>
                                <th class="py-3 px-3 text-center">Е2 (/40)</th>
                                <th class="py-3 px-3 text-center">Е3 (/40)</th>
                                <th class="py-3 px-4 text-right">Дії</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-neutral-100 text-sm">
                            <template x-if="candidates.length === 0">
                                <tr>
                                    <td colspan="5" class="py-12 text-center text-neutral-400 font-mono text-sm">
                                        Список поки порожний. Додайте першого кандидата зліва.
                                    </td>
                                </tr>
                            </template>

                            <template x-for="candidate in candidates" :key="candidate.id">
                                <tr class="hover:bg-neutral-50/50">
                                    <td class="py-3 px-4">
                                        <div class="font-semibold text-neutral-900" x-text="candidate.name"></div>
                                        <div class="text-xs text-neutral-500 font-mono" x-text="candidate.media"></div>
                                    </td>
                                    <!-- Поля быстрого редактирования баллов -->
                                    <td class="py-3 px-3 text-center">
                                        <input type="number" step="0.1" x-model.number="candidate.stage1" @change="updateCandidate(candidate)"
                                            class="w-16 bg-neutral-50 border border-neutral-200 px-1 py-1 text-center font-mono text-xs focus:bg-white focus:border-neutral-900">
                                    </td>
                                    <td class="py-3 px-3 text-center">
                                        <input type="number" step="0.1" x-model.number="candidate.stage2" @change="updateCandidate(candidate)"
                                            class="w-16 bg-neutral-50 border border-neutral-200 px-1 py-1 text-center font-mono text-xs focus:bg-white focus:border-neutral-900">
                                    </td>
                                    <td class="py-3 px-3 text-center">
                                        <input type="number" step="0.1" x-model.number="candidate.stage3" @change="updateCandidate(candidate)"
                                            class="w-16 bg-neutral-50 border border-neutral-200 px-1 py-1 text-center font-mono text-xs focus:bg-white focus:border-neutral-900">
                                    </td>
                                    <td class="py-3 px-4 text-right">
                                        <button @click="deleteCandidate(candidate.id)" class="text-xs font-mono text-red-500 hover:text-red-700 underline">
                                            Видалити
                                        </button>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>

    </main>

    <!-- Скрипт управления и связи с Supabase -->
    <script>
        // Вставьте сюда ваши ключи проекта из Supabase (те же самые, что и на публичном сайте)
        const SUPABASE_URL = 'YOUR_SUPABASE_URL';
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
        
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function adminDashboard() {
            return {
                candidates: [],
                newCandidate: {
                    name: '',
                    media: 'Українська правда',
                    stage1: 0,
                    stage2: 0,
                    stage3: 0
                },

                init() {
                    this.fetchCandidates();
                },

                // Загрузка списка из базы
                async fetchCandidates() {
                    const { data, error } = await supabaseClient
                        .from('candidates')
                        .select('*')
                        .order('name', { ascending: true });
                    
                    if (!error && data) {
                        this.candidates = data;
                    }
                },

                // Добавление нового кандидата
                async addCandidate() {
                    if (!this.newCandidate.name.trim()) return;

                    const { error } = await supabaseClient
                        .from('candidates')
                        .insert([this.newCandidate]);

                    if (!error) {
                        // Сброс формы и обновление списка
                        this.newCandidate.name = '';
                        this.newCandidate.stage1 = 0;
                        this.newCandidate.stage2 = 0;
                        this.newCandidate.stage3 = 0;
                        this.fetchCandidates();
                    } else {
                        alert('Помилка при додаванні: ' + error.message);
                    }
                },

                // Автоматическое обновление баллов при изменении в инпуте
                async updateCandidate(candidate) {
                    const { error } = await supabaseClient
                        .from('candidates')
                        .update({
                            stage1: parseFloat(candidate.stage1) || 0,
                            stage2: parseFloat(candidate.stage2) || 0,
                            stage3: parseFloat(candidate.stage3) || 0
                        })
                        .eq('id', candidate.id);

                    if (error) {
                        console.error('Помилка оновлення:', error.message);
                    }
                },

                // Удаление кандидата
                async deleteCandidate(id) {
                    if (!confirm('Ви дійсно хочете видалити цього кандидата?')) return;

                    const { error } = await supabaseClient
                        .from('candidates')
                        .delete()
                        .eq('id', id);

                    if (!error) {
                        this.fetchCandidates();
                    } else {
                        alert('Помилка видалення: ' + error.message);
                    }
                }
            }
        }
    </script>
</body>
</html>
