<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>РЕЙТИНГ СТАЖУВАННЯ 2026</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #ffffff;
            color: #111111;
        }
        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }
        /* Плавне переміщення рядків при зміні рейтингу */
        .candidate-row {
            transition: all 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        }
    </style>
</head>
<body class="bg-white text-neutral-900 antialiased min-h-screen selection:bg-neutral-900 selection:text-white" x-data="publicScoreboard()">

    <main class="max-w-6xl mx-auto px-6 py-12 md:py-20">

        <!-- Header -->
        <header class="border-b border-neutral-200 pb-8 mb-8 flex flex-col md:flex-row md:items-end justify-between gap-4">
            <div>
                <h1 class="text-3xl md:text-4xl font-bold tracking-tight">РЕЙТИНГ СТАЖУВАННЯ</h1>
                <p class="text-sm text-neutral-500 mt-2">Фінальний етап відбору та динамічний розподіл за результатами тестування.</p>
            </div>
            <!-- Live Status Indicator -->
            <div class="flex items-center gap-2 text-xs font-mono text-neutral-500 bg-neutral-50 px-3 py-2 border border-neutral-200 self-start md:self-auto">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                <span>LIVE СИНХРОНІЗАЦІЯ</span>
            </div>
        </header>

        <!-- Search Bar -->
        <div class="mb-8">
            <div class="relative max-w-sm">
                <input type="text" x-model="searchQuery" placeholder="Пошук за ім'ям..." 
                    class="w-full bg-white border border-neutral-200 px-4 py-2.5 text-sm focus:outline-none focus:border-neutral-900 transition font-sans placeholder-neutral-400">
            </div>
        </div>

        <!-- Scoreboard Table -->
        <div class="overflow-x-auto border-t border-b border-neutral-200">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="border-b border-neutral-200 text-xs font-mono text-neutral-400 uppercase tracking-wider">
                        <th class="py-4 px-4 w-16 text-center">Місце</th>
                        <th class="py-4 px-4">Кандидат / Редакція</th>
                        <th class="py-4 px-4 text-center hidden md:table-cell">Етап 1 <span class="block text-[10px] text-neutral-300">(/20)</span></th>
                        <th class="py-4 px-4 text-center hidden md:table-cell">Етап 2 <span class="block text-[10px] text-neutral-300">(/40)</span></th>
                        <th class="py-4 px-4 text-center hidden md:table-cell">Етап 3 <span class="block text-[10px] text-neutral-300">(/40)</span></th>
                        <th class="py-4 px-4 text-right font-bold text-neutral-900">Загальний бал</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-neutral-100 text-sm">
                    <!-- Якщо список порожній -->
                    <template x-if="filteredCandidates.length === 0">
                        <tr>
                            <td colspan="6" class="py-16 text-center text-neutral-400 font-mono text-sm">
                                Очікування даних від адміністративної панелі...
                            </td>
                        </tr>
                    </template>

                    <!-- Список кандидатів -->
                    <template x-for="candidate in filteredCandidates" :key="candidate.id">
                        <tr class="candidate-row hover:bg-neutral-50/80">
                            <!-- Ранг -->
                            <td class="py-4 px-4 text-center font-mono font-bold text-neutral-900">
                                <span x-text="candidate.rank" :class="candidate.rank <= 3 ? 'text-neutral-950 font-extrabold underline decoration-1 underline-offset-4' : 'text-neutral-500'"></span>
                            </td>

                            <!-- Ім'я та редакція -->
                            <td class="py-4 px-4">
                                <div class="font-semibold text-neutral-900 flex items-center gap-2">
                                    <span x-text="candidate.name"></span>
                                    <template x-if="candidate.rank <= 10">
                                        <span class="text-[10px] font-mono uppercase bg-neutral-100 text-neutral-800 px-1.5 py-0.5 border border-neutral-200">Топ-10</span>
                                    </template>
                                </div>
                                <div class="text-xs text-neutral-500 mt-0.5 font-mono">
                                    <span class="text-neutral-700 font-medium" x-text="candidate.media"></span>
                                </div>
                            </td>

                            <!-- Етап 1 -->
                            <td class="py-4 px-4 text-center font-mono text-neutral-600 hidden md:table-cell" x-text="Number(candidate.stage1).toFixed(1)"></td>

                            <!-- Етап 2 -->
                            <td class="py-4 px-4 text-center font-mono text-neutral-600 hidden md:table-cell" x-text="Number(candidate.stage2).toFixed(1)"></td>

                            <!-- Етап 3 -->
                            <td class="py-4 px-4 text-center font-mono text-neutral-600 hidden md:table-cell" x-text="Number(candidate.stage3).toFixed(1)"></td>

                            <!-- Загальний бал -->
                            <td class="py-4 px-4 text-right font-mono font-bold text-base text-neutral-900" x-text="Number(candidate.total_score).toFixed(2)"></td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </div>

        <!-- Footer -->
        <footer class="mt-16 pt-6 border-t border-neutral-200 flex flex-col sm:flex-row justify-between items-center text-xs font-mono text-neutral-400 gap-4">
            <div>Автоматизований розрахунок: <span class="text-neutral-700">(Е1 × 0.2) + (Е2 × 0.4) + (Е3 × 0.4)</span></div>
            <div>GitHub Pages • Realtime Engine</div>
        </footer>

    </main>

    <!-- Логіка підключення до Supabase та сортування -->
    <script>
        const SUPABASE_URL = 'https://xesvenfrzgqiawetwtxo.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhlc3ZlbmFrZmx6Z3FpYXdldHd0eG8iLCJyb2xlIjoiYW5vbiIsImlhdCI6MTc5MjY1MjY0NywiZXhwIjoyMTA4MjI4NjQ3f5.c1RD4vITIz0PHvEM-EJ0VS9HYF7OoxUL9-g2juWPdmY';
        
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function publicScoreboard() {
            return {
                searchQuery: '',
                rawCandidates: [],

                init() {
                    this.fetchData();
                    this.subscribeRealtime();
                },

                // Завантаження початкових даних з бази
                async fetchData() {
                    const { data, error } = await supabaseClient
                        .from('candidates')
                        .select('*');
                    
                    if (!error && data) {
                        this.rawCandidates = data;
                    }
                },

                // Підписка на зміни в реальному часі через WebSockets
                subscribeRealtime() {
                    supabaseClient
                        .channel('public:candidates')
                        .on('postgres_changes', { event: '*', schema: 'public', table: 'candidates' }, payload => {
                            this.fetchData();
                        })
                        .subscribe();
                },

                // Геттер для фільтрації, автоматичного розрахунку формули та сортування місць
                get filteredCandidates() {
                    let res = this.rawCandidates.map(c => {
                        const s1 = parseFloat(c.stage1) || 0;
                        const s2 = parseFloat(c.stage2) || 0;
                        const s3 = parseFloat(c.stage3) || 0;
                        const total = (s1 * 0.2) + (s2 * 0.4) + (s3 * 0.4);
                        return { ...c, total_score: total };
                    });

                    // Фільтрація за пошуком
                    res = res.filter(c => c.name.toLowerCase().includes(this.searchQuery.toLowerCase()));

                    // Сортування за спаданням загального бала
                    res.sort((a, b) => b.total_score - a.total_score);

                    // Присвоєння актуальних місць (рангів)
                    res.forEach((item, idx) => {
                        item.rank = idx + 1;
                    });

                    return res;
                }
            }
        }
    </script>
</body>
</html>
